<!doctype html>
<!-- What the window shows until Seismic answers; then the shell (src/main.rs) loads the project. And while an update goes in. -->
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="frost.css" />
    <script src="strings.js"></script>
    <style>
      body { display: grid; place-content: center; justify-items: center; gap: 16px; color: var(--muted-foreground); }
      img { width: 64px; height: 64px; animation: breathe 1.6s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: .45; } }
    </style>
  </head>
  <body>
    <img src="logo.svg" alt="" />
    <div id="what"></div>
    <script>
      // ?updating: the shell installs an update (src/update.rs) and then starts the app again
      document.title = SEISMIC_STRINGS.title;
      document.getElementById('what').textContent = SEISMIC_STRINGS[location.search === '?updating' ? 'updating' : 'starting'];
    </script>
  </body>
</html>

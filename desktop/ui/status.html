<!doctype html>
<!-- What the app shows when the selected remote workspace does not answer. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Seismic</title>
    <link rel="stylesheet" href="frost.css" />
    <script src="strings.js"></script>
    <style>
      body { display: grid; place-content: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 28rem; display: grid; gap: 14px; justify-items: start; }
      svg { width: 48px; height: 48px; color: var(--muted-foreground); }
      h1 { margin: 0; font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
      p { margin: 0; color: var(--muted-foreground); overflow-wrap: anywhere; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: inherit; cursor: pointer; }
      button.primary { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
      button:disabled { opacity: .55; cursor: default; }
      button[aria-disabled="true"] { opacity: .55; cursor: default; }
      button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      #open-result:empty { position: absolute; }
      h2 { margin: 10px 0 0; font-size: 13px; font-weight: 600; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .04em; }
      [data-tauri-drag-region] { position: fixed; inset: 0 0 auto; height: 50px; }
    </style>
  </head>
  <body>
    <div data-tauri-drag-region></div>
    <main>
      <!-- Lucide's cloud-alert (ISC) -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12v4" /><path d="M12 20h.01" /><path d="M8.128 16.949A7 7 0 1 1 15.71 8h1.79a1 1 0 0 1 0 9h-1.642" /></svg>
      <h1 id="title"></h1>
      <p id="why"></p>
      <div class="row"><button id="retry" class="primary" type="button"></button></div>
      <h2 id="others-title" hidden></h2>
      <div id="others" class="row"></div>
      <p id="open-result" role="status"></p>
    </main>
    <script>
      const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
      // the text, from src/ui/strings.ts (desktopPages) through strings.js
      const s = window.SEISMIC_STRINGS.status;
      const fill = window.fillString;
      const WHY = ['unreachable', 'notSeismic', 'notLoaded'];
      const $ = (id) => document.getElementById(id);
      $('title').textContent = s.title;
      $('retry').textContent = s.retry;
      $('others-title').textContent = s.others;
      const others = $('others');
      const buttons = new Map();
      let opening = false;
      let listLoad = 0;
      async function openWorkspace(id, name) {
        if (opening) return;
        opening = true;
        for (const button of buttons.values()) button.setAttribute('aria-disabled', 'true');
        $('open-result').textContent = fill(s.switching, name);
        try {
          await invoke('open_desk', { id });
          $('open-result').textContent = '';
        } catch (error) {
          const currentName = buttons.get(id)?.textContent || name;
          $('open-result').textContent = error === 'superseded' ? ''
            : error === 'unknown' ? fill(s.gone, currentName)
            : error === 'drafts' ? s.drafts
            : fill(s.switchFailed, currentName);
        } finally {
          opening = false;
          for (const button of buttons.values()) button.removeAttribute('aria-disabled');
        }
      }
      async function load() {
        const request = ++listLoad;
        const desks = await invoke('desks');
        if (request !== listLoad) return;
        const own = desks.list.find((d) => d.id === desks.current);
        if (!own) return;
        $('title').textContent = fill(s.unresponsive, own.name);
        $('why').textContent = fill(WHY.includes(desks.problem) ? s[desks.problem] : s.check, own.origin);
        const workspaces = desks.list.filter((d) => d.id !== own.id);
        $('others-title').hidden = !workspaces.length;
        const focused = others.contains(document.activeElement) ? document.activeElement : null;
        const ids = new Set(workspaces.map((d) => d.id));
        for (const [id, button] of buttons) {
          if (!ids.has(id)) {
            button.remove();
            buttons.delete(id);
          }
        }
        workspaces.forEach((d, index) => {
          let button = buttons.get(d.id);
          if (!button) {
            button = document.createElement('button');
            button.type = 'button';
            buttons.set(d.id, button);
            if (opening) button.setAttribute('aria-disabled', 'true');
          }
          if (button.textContent !== d.name) button.textContent = d.name;
          button.onclick = () => openWorkspace(d.id, d.name);
          if (others.children[index] !== button) others.insertBefore(button, others.children[index] ?? null);
        });
        if (focused?.isConnected && document.activeElement !== focused) focused.focus();
      }
      $('retry').onclick = async () => {
        const b = $('retry');
        b.disabled = true;
        b.textContent = s.retrying;
        try {
          await invoke('retry_desk');
        } catch {
          await load();
        } finally {
          b.disabled = false;
          b.textContent = s.retry;
        }
      };
      window.addEventListener('seismic-desks', load);
      window.addEventListener('pageshow', (event) => { if (event.persisted) load(); });
      load();
    </script>
  </body>
</html>

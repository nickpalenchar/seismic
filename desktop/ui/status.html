<!doctype html>
<!-- What a remote workspace's window shows when the shell found it does not answer (src/desks/mod.rs):
     try again, or open another workspace. The only page besides the workspace's own its window shows. -->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Seismic</title>
    <link rel="stylesheet" href="frost.css" />
    <style>
      body { display: grid; place-content: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 28rem; display: grid; gap: 14px; justify-items: start; }
      img { width: 48px; height: 48px; }
      h1 { margin: 0; font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
      p { margin: 0; color: var(--muted-foreground); overflow-wrap: anywhere; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      button { font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: inherit; cursor: pointer; }
      button.primary { background: var(--foreground); border-color: var(--foreground); color: var(--background); }
      button:disabled { opacity: .55; cursor: default; }
      button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      h2 { margin: 10px 0 0; font-size: 13px; font-weight: 600; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .04em; }
      [data-tauri-drag-region] { position: fixed; inset: 0 0 auto; height: 50px; }
    </style>
  </head>
  <body>
    <div data-tauri-drag-region></div>
    <main>
      <img src="logo.svg" alt="" />
      <h1 id="title">Seismic</h1>
      <p id="why"></p>
      <div class="row"><button id="retry" class="primary" type="button">Try again</button></div>
      <h2 id="others-title" hidden>Open another workspace</h2>
      <div id="others" class="row"></div>
    </main>
    <script>
      const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
      const WHY = {
        unreachable: (o) => `Nothing answers at ${o}. The machine may be off or asleep, or not on this network.`,
        notSeismic: (o) => `Something answers at ${o}, but it is not Seismic.`,
      };
      const $ = (id) => document.getElementById(id);
      let desks;
      async function load() {
        desks = await invoke('desks');
        const own = desks.list.find((d) => d.id === desks.current);
        if (!own) return;
        const reason = WHY[desks.problem];
        $('title').textContent = reason ? `${own.name} does not answer` : own.name;
        $('why').textContent = reason ? reason(own.origin) : `Check whether Seismic answers at ${own.origin}.`;
        const others = desks.list.filter((d) => d.id !== own.id);
        $('others-title').hidden = !others.length;
        $('others').replaceChildren(
          ...others.map((d) => {
            const b = document.createElement('button');
            b.type = 'button';
            b.textContent = d.name;
            b.onclick = () => invoke('open_desk', { id: d.id });
            return b;
          }),
        );
      }
      $('retry').onclick = async () => {
        const b = $('retry');
        b.disabled = true;
        b.textContent = 'Trying …';
        try {
          await invoke('retry_desk');
        } catch {
          await load();
        } finally {
          b.disabled = false;
          b.textContent = 'Try again';
        }
      };
      window.addEventListener('seismic-desks', load);
      window.addEventListener('pageshow', (event) => { if (event.persisted) load(); });
      load();
    </script>
  </body>
</html>

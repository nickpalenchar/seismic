[package]
name = "seismic-app"
version = "0.1.0"
description = "Seismic: a spatial project for directing AI coding agents"
license = "MIT"
edition = "2021"

[[bin]]
name = "seismic"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde_json = "1"
# TLS with the system's roots: the shell pairs with a remote workspace and checks it answers (desks/remote.rs)
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs"] }
tauri-plugin-updater = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKFrameInfo", "WKSecurityOrigin", "WKUIDelegate", "WKWebView", "WKWebViewConfiguration", "block2"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }

# wry with the macOS IPC gate (vendor/README.md)
[patch.crates-io]
wry = { path = "vendor/wry" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

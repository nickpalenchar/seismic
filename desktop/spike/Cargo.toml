[package]
name = "seismic-webview-spike"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "webview-spike"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKUserContentController", "WKScriptMessage", "WKFrameInfo", "WKSecurityOrigin"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

# The desktop workspace spike (docs/design/desktop-workspaces.md) on each platform's webview (desktop/spike/run.ts
# describes the checks): WKWebView on macOS, WebView2 on Windows, WebKitGTK on Linux under Xvfb.
# Runs by hand and on a push that changes the spike; each job uploads its findings (spike-<os>.json).
name: Webview spike

on:
  workflow_dispatch:
  push:
    paths: ['desktop/spike/**', '.github/workflows/webview-spike.yml']

permissions:
  contents: read

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'desktop/spike -> target' }
      - run: rm -f desktop/spike/target/spike-*.json
      - name: WebKitGTK and a display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-x11
      - run: cargo build --locked
        id: build
        working-directory: desktop/spike
      - name: The spike
        run: |
          binary=desktop/spike/target/debug/webview-spike
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- bun desktop/spike/run.ts "$binary"
          else
            bun desktop/spike/run.ts "$binary${{ runner.os == 'Windows' && '.exe' || '' }}"
          fi
      - name: HTTPS cookie lifecycle
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          binary=desktop/spike/target/debug/webview-spike
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a dbus-run-session -- bash desktop/spike/https.sh "$binary"
          else
            bash desktop/spike/https.sh "$binary${{ runner.os == 'Windows' && '.exe' || '' }}"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spike-${{ matrix.os }}
          path: desktop/spike/target/spike-*.json

# Builds Seismic on every platform it ships for, each on its own runner (no cross compilation, so the
# smoke test runs where the build ran). A push to main that changes code (not only docs or the site)
# builds the unsigned installers, checks the compiled server (scripts/check-binary.ts: a scratch
# project answers, with the version, a repository's own adapter, Playwright and the adapter kit
# from the resources) and runs the tests and the type check; the installers stay a week as the
# run's artifacts. A tag v<version of package.json> does the same and then makes a draft release
# with every installer, SHA256SUMS and latest.json for the updater (scripts/release.ts), its notes
# the version's section of CHANGELOG.md with the commits since the tag before folded under it; the
# owner publishes it, and installed apps then offer it (docs/release.md). A tag without its section
# in CHANGELOG.md fails at once. A release candidate's tag, v<version>-rc.<n>, needs no section and
# stays a draft (marked as a pre-release): only the repository's collaborators see and download it.
# Update artifacts and their signatures come only with the secret TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD, if the key has one).
# On a tag, the Macs' app is signed with the Developer ID and notarised, the ticket stapled to the
# DMG (scripts/build-app.ts), with the secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_NOTARY_KEY, APPLE_NOTARY_KEY_ID and, for a team key, APPLE_NOTARY_ISSUER (docs/release.md);
# without them a tag fails rather than releasing an app macOS would not open. Run by hand with
# "sign", the workflow does that on any branch, to try the secrets before a tag. Windows and Linux
# stay unsigned; SHA256SUMS lists every file of the release.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # what leaves the running code as it is (as INERT in src/server/self-update.ts); path filters
    # do not apply to tags
    paths-ignore: ['docs/**', 'design/**', 'site/**', '**/*.md']
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarise the macOS app, as on a tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - name: The tag is the version in package.json, with its section in CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: bun scripts/release.ts check "$GITHUB_REF_NAME"
      # the demo voice's tests run its sidecars through uv, and ffmpeg makes their WAVs; setup-uv
      # tags only whole versions since v8. No cache: the sidecars' few dependencies come with
      # `uv run --with`, so there is no lock or requirements file to key one on.
      - uses: astral-sh/setup-uv@v10.3.0
        with: { enable-cache: false }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: bun test
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
          bun test --parallel

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: windows-x64 }
          # 22.04: an AppImage runs where the glibc is the one it was built with or newer
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      SIGN_MACOS: ${{ startsWith(matrix.target, 'darwin') && (startsWith(github.ref, 'refs/tags/') || inputs.sign) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: 'desktop -> target' }
      - name: WebKitGTK and GStreamer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - run: bun install --frozen-lockfile
      - name: Windows process snapshot regression
        if: runner.os == 'Windows'
        run: bun test src/server/test/llms/harnesses/windowsProcessSnapshot.test.ts
      - name: The Apple secrets are there
        if: env.SIGN_MACOS == 'true'
        env:
          HAVE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_NOTARY_KEY != '' && secrets.APPLE_NOTARY_KEY_ID != '' }}
        run: '[ "$HAVE" = true ] || { echo "::error::signing needs the secrets APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_NOTARY_KEY and APPLE_NOTARY_KEY_ID (docs/release.md)"; exit 1; }'
      - name: The compiled server and the app around it
        run: bun scripts/build-app.ts
        env:
          APPLE_CERTIFICATE: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_NOTARY_KEY: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_NOTARY_KEY || '' }}
          APPLE_NOTARY_KEY_ID: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_NOTARY_KEY_ID || '' }}
          APPLE_NOTARY_ISSUER: ${{ env.SIGN_MACOS == 'true' && secrets.APPLE_NOTARY_ISSUER || '' }}
      - name: Smoke test of the compiled server
        shell: bash
        run: |
          version="$(bun -p "require('./package.json').version")"
          bun scripts/check-binary.ts "dist/seismic-$version-${{ matrix.target }}/seismic${{ runner.os == 'Windows' && '.exe' || '' }}"
      - run: bun scripts/release.ts collect ${{ matrix.target }} release
      - uses: actions/upload-artifact@v7
        with:
          name: seismic-${{ matrix.target }}
          path: release
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the folded commits need the history back to the tag before
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.3 }
      - uses: actions/download-artifact@v8
        with: { path: release, pattern: 'seismic-*', merge-multiple: true }
      # the version's section of CHANGELOG.md: the start of the notes, and what the app's bar shows
      - run: bun scripts/release.ts section "$GITHUB_REF_NAME" section.md
      - run: bun scripts/release.ts notes "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" notes.md
      - run: bun scripts/release.ts manifest release "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" section.md
      # every release starts as a draft: a release's the owner publishes, a release candidate's stays
      # one, marked as a pre-release so that publishing it by mistake does not make it the latest
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then kind=(--prerelease --latest=false); else kind=(--latest); fi
          gh release create "$GITHUB_REF_NAME" --draft "${kind[@]}" --verify-tag --title "Seismic ${GITHUB_REF_NAME#v}" --notes-file notes.md release/*
